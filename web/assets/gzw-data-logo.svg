<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">GZW Data</title>
  <desc id="desc">A purple data-node mark on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15111f"/>
      <stop offset="1" stop-color="#282A36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BD93F9"/>
      <stop offset="1" stop-color="#FF79C6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <path d="M31 39h38M31 64h27M31 89h38" fill="none" stroke="#6272A4" stroke-linecap="round" stroke-width="7" opacity=".65"/>
  <path d="M78 30v68M78 64h19" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="8" filter="url(#glow)"/>
  <circle cx="78" cy="30" r="8" fill="#BD93F9"/>
  <circle cx="78" cy="64" r="9" fill="#FF79C6"/>
  <circle cx="78" cy="98" r="8" fill="#BD93F9"/>
  <circle cx="97" cy="64" r="7" fill="#8BE9FD"/>
</svg>
